<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Box</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
        }
        #dice-box {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: min(90vw, 420px);
        }
        #motion-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(10, 16, 25, 0.7);
            color: #f7fafc;
            font-family: system-ui, sans-serif;
        }
        #motion-controls button {
            align-self: flex-start;
            border: 0;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: 600;
        }
        #motion-status {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <main id="dice-box"></main>
    <div id="ui-container">
        <section id="motion-controls">
            <strong>Mobiel schudden</strong>
            <button id="enable-motion" type="button">Activeer schudden</button>
            <span id="motion-status">Schud je telefoon om opnieuw te gooien.</span>
        </section>
        <div id="advanced-roller-container"></div>
        <div id="display-results-container"></div>
    </div>
    <script type="module">
        import DiceBox from './src/index.js';
        import { AdvancedRoller, DisplayResults, BoxControls } from '@3d-dice/dice-ui/src/index.js';

        document.addEventListener('DOMContentLoaded', () => {
            const diceBox = new DiceBox({
                container: '#dice-box',
                assetPath: '/assets/',
            });
            const motionButton = document.querySelector('#enable-motion');
            const motionStatus = document.querySelector('#motion-status');
            let lastNotation = '2d6';
            let lastShakeAt = 0;
            let motionEnabled = false;
            const SHAKE_THRESHOLD = 22;
            const SHAKE_COOLDOWN_MS = 1200;

            const displayResults = new DisplayResults('#display-results-container');

            const advancedRoller = new AdvancedRoller({
                target: '#advanced-roller-container',
                onSubmit: (notation) => {
                    lastNotation = notation;
                    diceBox.roll(notation);
                },
                onClear: () => {
                    diceBox.clear();
                    displayResults.clear();
                }
            });

            diceBox.onRollComplete = (results) => {
                displayResults.showResults(results);
            };

            const onMotion = (event) => {
                const acceleration = event.accelerationIncludingGravity;
                if (!acceleration) {
                    return;
                }

                const x = Math.abs(acceleration.x || 0);
                const y = Math.abs(acceleration.y || 0);
                const z = Math.abs(acceleration.z || 0);
                const magnitude = x + y + z;

                const now = Date.now();
                if (magnitude > SHAKE_THRESHOLD && now - lastShakeAt > SHAKE_COOLDOWN_MS) {
                    lastShakeAt = now;
                    motionStatus.textContent = `Schudden gedetecteerd → ${lastNotation}`;
                    diceBox.roll(lastNotation);
                }
            };

            const setupMotionControls = async () => {
                if (motionEnabled) {
                    return;
                }

                if (!window.DeviceMotionEvent) {
                    motionStatus.textContent = 'Dit apparaat ondersteunt geen bewegingssensor.';
                    motionButton.disabled = true;
                    return;
                }

                const requestPermission = window.DeviceMotionEvent.requestPermission;
                if (typeof requestPermission === 'function') {
                    const permissionState = await requestPermission();
                    if (permissionState !== 'granted') {
                        motionStatus.textContent = 'Toestemming geweigerd. Schudden is uitgeschakeld.';
                        return;
                    }
                }

                window.addEventListener('devicemotion', onMotion, { passive: true });
                motionEnabled = true;
                motionButton.disabled = true;
                motionStatus.textContent = 'Schudden actief. Schud je telefoon om de dobbelstenen te rollen.';
            };

            motionButton.addEventListener('click', () => {
                setupMotionControls().catch((error) => {
                    console.error('Kon bewegingsdetectie niet activeren:', error);
                    motionStatus.textContent = 'Activeren mislukt. Controleer permissies van je browser.';
                });
            });

            diceBox.init().then(() => {
                diceBox.resizeWorld(); // Force a resize after initialization
                const onUpdate = (config) => {
                    diceBox.updateConfig(config);
                };

                const boxControls = new BoxControls({
                    themes: Object.keys(diceBox.themesLoadedData),
                    onUpdate: onUpdate,
                    themeColor: diceBox.config.themeColor
                });
                // for some reason dat.gui is not updating the dropdown with the new themes
                // this is a workaround to force the update
                boxControls.themeSelect.remove();
                boxControls.themeSelect = boxControls.gui.__folders.Rendering.add(boxControls.config, 'theme', Object.keys(diceBox.themesLoadedData)).onChange(boxControls.handleUpdate.bind(boxControls));
                
                diceBox.roll(lastNotation);
            });
        });
    </script>
</body>
</html>
